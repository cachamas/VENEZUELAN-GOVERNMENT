<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Preview</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #f8f9fa; color: #202122; font-family: Arial, Helvetica, sans-serif;
         display: flex; flex-direction: column; }
  header { border-bottom: 1px solid #a2a9b1; background: #fff; padding: 8px 14px;
           display: flex; align-items: center; gap: 14px; min-width: 0; }
  header a { color: #0645ad; text-decoration: none; font-weight: 600; font-size: 12px;
             white-space: nowrap; flex: none; }
  header a:hover { text-decoration: underline; }
  #rv-title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  main { flex: 1; display: grid; place-items: center; padding: 24px; min-height: 0; }
  main img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff;
             box-shadow: 0 2px 14px rgba(0,0,0,.18); border: 1px solid #a2a9b1; }
  footer { text-align: center; padding: 10px; font-size: 11px; color: #54595d;
           border-top: 1px solid #a2a9b1; background: #fff; }
</style>
</head>
<body>
  <header>
    <a id="rv-back" href="#">&#8592;</a>
    <span id="rv-title"></span>
  </header>
  <main>
    <img id="rv-img" alt="">
  </main>
  <footer id="rv-footer"></footer>
  <script>
  (function () {
    var q = new URLSearchParams(location.search);
    var f = q.get('file') || '';
    var t = q.get('title') || f;
    var k = q.get('f') || 'default';
    var es = q.get('lang');
    if (!es) { try { es = (window.top && window.top.__PORTFOLIO_LANG__ === 'es') ? 'es' : ''; } catch (e) {} }
    document.title = t;
    document.getElementById('rv-img').src = f;
    document.getElementById('rv-img').alt = t;
    document.getElementById('rv-title').textContent = t;
    var back = document.getElementById('rv-back');
    back.href = 'image_format.html?f=' + encodeURIComponent(k) + (es ? '&lang=es' : '');
    back.textContent = es ? '\u2190 P\u00e1gina del archivo' : '\u2190 File page';
    document.getElementById('rv-footer').textContent = es
      ? 'Archivo original \u2014 abierto en el navegador del sitio'
      : 'Original file \u2014 opened in the on-site browser';
  })();
  </script>
</body>
</html>
